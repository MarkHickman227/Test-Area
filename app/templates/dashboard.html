<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — LinkedIn Post Scheduler</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="navbar-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color: var(--primary)">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
            Post Scheduler
        </a>
        <div class="navbar-user">
            <span id="user-name"></span>
            <img id="user-avatar" src="" alt="Avatar" style="display:none">
            <a href="/" class="btn btn-sm btn-primary" style="background: transparent; color: var(--text-muted);">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="header-row">
            <h1>Your Posts</h1>
            <button class="btn btn-primary btn-sm" onclick="toggleCompose()">+ New Post</button>
        </div>

        <!-- Compose form -->
        <div class="card" id="compose-card" style="display: none;">
            <h2>Schedule a Post</h2>
            <form id="compose-form" onsubmit="schedulePost(event)">
                <div class="form-group">
                    <label for="content">Post content</label>
                    <textarea id="content" rows="4" placeholder="What do you want to share?" required></textarea>
                </div>
                <div class="form-group">
                    <label for="scheduled_at">Schedule for</label>
                    <input type="datetime-local" id="scheduled_at" required>
                </div>
                <button type="submit" class="btn btn-primary">Schedule Post</button>
            </form>
        </div>

        <!-- Posts list -->
        <div class="card">
            <div id="posts-list">
                <div class="empty-state">Loading posts...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
