networks:
  public_net:
    driver: bridge
  app_net:
    driver: bridge
    internal: true
  gpu_net:
    driver: bridge
    internal: true

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - public_net
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    networks:
      - public_net
    expose:
      - "3000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://privatecanvas:privatecanvas@postgres:5432/privatecanvas
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      JOB_EXECUTION: celery
      MAIL_BACKEND: smtp
      SMTP_HOST: mailhog
    networks:
      - public_net
      - app_net
    depends_on:
      - postgres
      - redis
      - minio
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://privatecanvas:privatecanvas@postgres:5432/privatecanvas
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      JOB_EXECUTION: celery
    networks:
      - app_net
      - gpu_net
    depends_on:
      - postgres
      - redis
      - minio
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: privatecanvas
      POSTGRES_PASSWORD: privatecanvas
      POSTGRES_DB: privatecanvas
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - app_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio:/data
    networks:
      - app_net
    expose:
      - "9000"

  mailhog:
    image: mailhog/mailhog:latest
    networks:
      - app_net
      - public_net
    ports:
      - "8025:8025"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app_net
    profiles: ["observability"]

volumes:
  pgdata:
  minio:
