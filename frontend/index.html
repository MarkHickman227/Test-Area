<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApplyPilot</title>
    <link rel="stylesheet" href="/styles.css?v=cv5" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">ApplyPilot</p>
        <h1>Job application dashboard</h1>
      </div>
      <nav class="header-nav">
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="analytics">Analytics</button>
        <button class="nav-btn" data-view="cvs">CVs</button>
      </nav>
      <div id="health" class="health">Checking API...</div>
    </header>

    <main id="view-dashboard">
      <section class="metrics-strip" aria-label="Application counts">
        <button type="button" class="metric-tile active" data-filter-status="" data-filter-type="">
          <span class="metric-label">Total</span>
          <span class="metric-value" id="count-total">0</span>
        </button>
        <button type="button" class="metric-tile" data-filter-status="SUBMITTED" data-filter-type="">
          <span class="metric-label">Applied</span>
          <span class="metric-value" id="count-applied">0</span>
        </button>
        <button type="button" class="metric-tile" data-filter-status="SUBMITTED" data-filter-type="PERM">
          <span class="metric-label">PERM applied</span>
          <span class="metric-value" id="count-perm">0</span>
        </button>
        <button type="button" class="metric-tile" data-filter-status="SUBMITTED" data-filter-type="CONTRACT">
          <span class="metric-label">CONTRACT applied</span>
          <span class="metric-value" id="count-contract">0</span>
        </button>
        <button type="button" class="metric-tile" data-filter-status="NEW" data-filter-type="">
          <span class="metric-label">New</span>
          <span class="metric-value" id="count-new">0</span>
        </button>
        <button type="button" class="metric-tile" data-filter-status="DRAFT" data-filter-type="">
          <span class="metric-label">Drafts</span>
          <span class="metric-value" id="count-draft">0</span>
        </button>
        <button type="button" class="metric-tile" data-filter-min-score="60" data-filter-status="" data-filter-type="">
          <span class="metric-label">Score 60+</span>
          <span class="metric-value" id="count-score60">0</span>
        </button>
        <button type="button" class="metric-tile" data-filter-status="INTERVIEW" data-filter-type="">
          <span class="metric-label">Interviews</span>
          <span class="metric-value" id="count-interview">0</span>
        </button>
        <button type="button" class="metric-tile" data-filter-status="OFFER" data-filter-type="">
          <span class="metric-label">Offers</span>
          <span class="metric-value" id="count-offer">0</span>
        </button>
        <button type="button" class="metric-tile" data-filter-status="REJECTED" data-filter-type="">
          <span class="metric-label">Rejected</span>
          <span class="metric-value" id="count-rejected">0</span>
        </button>
      </section>

      <div class="layout">
        <aside class="sidebar">
          <section class="card jobs-card">
            <div class="jobs-header">
              <h2>Jobs <span id="jobs-filter-label" class="meta">All</span></h2>
              <button id="refresh" type="button" class="secondary">Refresh</button>
            </div>
            <div id="jobs" class="jobs-list">Loading jobs...</div>
          </section>
        </aside>

        <section id="detail" class="detail card">
          <h2>Select a job</h2>
          <p>Choose a scored opportunity to review the job description, fit explanation, and application artifacts.</p>
        </section>
      </div>
    </main>

    <main id="view-analytics" class="view-panel" style="display:none">
      <section class="card">
        <h2>Pipeline Analytics</h2>
        <div id="analytics-content">Loading analytics...</div>
      </section>
    </main>

    <main id="view-cvs" class="view-panel" style="display:none">
      <section class="card">
        <h2>CV Management</h2>
        <div id="cv-list">Loading CVs...</div>
        <p><button class="secondary" type="button" id="cv-reparse">Reparse stored CVs</button></p>
        <h3>Upload new CV</h3>
        <label>Label <input id="cv-label" type="text" placeholder="e.g. EA Focus" /></label>
        <label>File name <input id="cv-filename" type="text" placeholder="cv_architecture.pdf" /></label>
        <label>CV text <textarea id="cv-text" placeholder="Paste your CV text here..."></textarea></label>
        <button id="cv-upload" type="button">Upload CV</button>
      </section>
    </main>

    <script src="/app.js?v=cv5"></script>
    <script src="/extras.js?v=cv5"></script>
  </body>
</html>
