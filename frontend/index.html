<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApplyPilot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">ApplyPilot</p>
        <h1>Job application review dashboard</h1>
      </div>
      <nav class="header-nav">
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="analytics">Analytics</button>
        <button class="nav-btn" data-view="cvs">CVs</button>
      </nav>
      <div id="health" class="health">Checking API...</div>
    </header>

    <main id="view-dashboard" class="layout">
      <aside class="sidebar">
        <section class="card">
          <h2>Filters</h2>
          <label>Status
            <select id="status-filter">
              <option value="">All</option>
              <option>NEW</option>
              <option>DRAFT</option>
              <option>READY</option>
              <option>SUBMITTED</option>
              <option>INTERVIEW</option>
              <option>OFFER</option>
              <option>REJECTED</option>
            </select>
          </label>
          <label>Type
            <select id="type-filter">
              <option value="">All</option>
              <option value="PERM">Permanent</option>
              <option value="CONTRACT">Contract</option>
            </select>
          </label>
          <label>Minimum score
            <input id="score-filter" type="number" min="0" max="100" placeholder="60" />
          </label>
          <button id="refresh">Refresh jobs</button>
        </section>

        <section class="card jobs-card">
          <h2>Jobs</h2>
          <div id="jobs" class="jobs-list">Loading jobs...</div>
        </section>
      </aside>

      <section id="detail" class="detail card">
        <h2>Select a job</h2>
        <p>Choose a scored opportunity to review the job description, fit explanation, and application artifacts.</p>
      </section>
    </main>

    <main id="view-analytics" class="view-panel" style="display:none">
      <section class="card">
        <h2>Pipeline Analytics</h2>
        <div id="analytics-content">Loading analytics...</div>
      </section>
    </main>

    <main id="view-cvs" class="view-panel" style="display:none">
      <section class="card">
        <h2>CV Management</h2>
        <div id="cv-list">Loading CVs...</div>
        <h3>Upload new CV</h3>
        <label>Label <input id="cv-label" type="text" placeholder="e.g. EA Focus" /></label>
        <label>File name <input id="cv-filename" type="text" placeholder="cv_architecture.pdf" /></label>
        <label>CV text <textarea id="cv-text" placeholder="Paste your CV text here..."></textarea></label>
        <button id="cv-upload">Upload CV</button>
      </section>
    </main>

    <script src="/app.js"></script>
    <script src="/extras.js"></script>
  </body>
</html>
